[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200 # Lowering this (e.g., to 200) reduces deployment gas
via_ir = true        # Highly recommended for 0.8.20+ to reduce stack-too-deep and gas

[rpc_endpoints]
tempo = "https://rpc.moderato.tempo.xyz"

[etherscan]
tempo = { key = "${ETHERSCAN_API_KEY}", url = "https://explore.moderato.tempo.xyz/api" }
